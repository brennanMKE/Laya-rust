[package]
name = "laya-server"
description = "A drop-in laya-server: /predict, /health and /stats compatible with laya_server.py and laya-go"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
laya = { path = "../laya" }
serde_json.workspace = true
subtle = "2.6"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util"] }
